# NetworkPolicy for the Multiarch Tuning Operator manager.
#
# Additive OpenShift/OLM convention:
# - DNS egress to openshift-dns on TCP/UDP 5353 (CoreDNS container port).
# - API egress is destination-less TCP 6443 because the API server is
#   host-networked and HCP makes pod/ClusterIP selectors unreliable.
# - Metrics ingress from openshift-monitoring on TCP 8443.
# - Health on TCP 8081 with no source restriction.
# Registry TCP 443 is omitted: the manager does not inspect images.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
  annotations:
    kubernetes.io/description: >-
      Additive NetworkPolicy for the Multiarch Tuning Operator manager.
      DNS uses openshift-dns on TCP/UDP 5353. API egress is destination-less
      TCP 6443 because the API server is host-networked and HCP makes
      pod/ClusterIP selectors unreliable.
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8081
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
      ports:
        - protocol: TCP
          port: 8443
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
          podSelector:
            matchLabels:
              dns.operator.openshift.io/daemonset-dns: default
      ports:
        - protocol: TCP
          port: 5353
        - protocol: UDP
          port: 5353
    - ports:
        - protocol: TCP
          port: 6443
